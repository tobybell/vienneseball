<h1>Program (2026)</h1>

<p>View or download the full program for the Viennese Ball:
<p><a href="/2026/program.pdf" target="_blank"><strong>Download Program (PDF)</strong></a>

<h2>View the Program</h2>

<!-- Always show a direct link (best on mobile) -->

  <a class="pdf-btn" href="/2026/program.pdf" target="_blank" rel="noopener">
    Open Program (PDF)
  </a>
</p>

<!-- Desktop embed -->
<div class="pdf-embed" style="margin-top: 12px;">
  <iframe
    src="/2026/program.pdf"
    width="100%"
    height="900"
    style="border:1px solid #ccc; border-radius:8px;"
    loading="lazy">
  </iframe>
</div>

</main>

<style>
/* Mobile shows button instead */
.pdf-mobile { display: none; }

}
.pdf-btn {
  display: inline-block;
  padding: 14px 18px;
  border: 1px solid #000;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 600;
}
</style>
